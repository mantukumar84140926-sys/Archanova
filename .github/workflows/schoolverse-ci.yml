name: SCHOOLVERSE branch validation

on:
  push:
    branches: [schoolverse-foundation]
    paths:
      - "app/schoolverse/**"
      - "app/api/schoolverse/**"
      - "lib/supabase/**"
      - "middleware.ts"
      - "supabase/migrations/**"
      - "scripts/validate-schoolverse-migrations.mjs"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/schoolverse-ci.yml"
  pull_request:
    branches: [schoolverse-foundation]
    paths:
      - "app/schoolverse/**"
      - "app/api/schoolverse/**"
      - "lib/supabase/**"
      - "middleware.ts"
      - "supabase/migrations/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/schoolverse-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate database migration history
        run: npm run validate:migrations
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
